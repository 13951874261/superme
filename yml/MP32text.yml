    - data:
        code: "import json\n\ndef main(response_body: str) -> dict:\n    try:\n        data = json.loads(response_body)\n        text = data.get('text', '').strip()\n    except Exception:\n        text = response_body\n    return {\n        'text': text\n    }\n"
