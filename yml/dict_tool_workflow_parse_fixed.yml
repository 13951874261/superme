          \ str(raw).strip()\n\ndef main(dict_type) -> dict:\n    s = _flat(dict_type)\n\
          \    if s not in _OPTS:\n        s = \"en_zh_bidirectional\"\n    if s ==\
          \ \"zh_modern\":\n        return {\"branch_num\": 1, \"route\": s}\n   \
