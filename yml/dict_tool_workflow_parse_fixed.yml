    - data:
        code: "import json\nimport re\nimport ast\n\
          \n_ALLOWED = {\"zh_modern\", \"en_en_business\", \"en_zh_bidirectional\"}\n\
          \n_REQUIRED_KEYS = {\n    \"zh_modern\": [\
          \n        \"pos\", \"definition\", \"phonetic\", \"usage_notes\", \"other_meanings\",\
          \n        \"example_sentences\", \"collocations\", \"synonyms\", \"antonyms\", \"confusable_pairs\",\
          \n    ],\n    \"en_en_business\": [\
          \n        \"headword\", \"pos\", \"phonetic\", \"definitions_en\", \"business_notes\",\
          \n        \"scenarios\", \"other_meanings\", \"example_sentences\", \"synonyms\", \"antonyms\",\
          \n        \"collocations\", \"meaning_zh\",\n    ],\n    \"en_zh_bidirectional\": [\
          \n        \"direction_resolved\", \"phonetic\", \"pos\", \"translation_main\",\
          \n        \"other_meanings\", \"business_examples\", \"example_sentences\",\
          \n        \"synonyms\", \"antonyms\", \"collocations\",\n    ],\n}\n\
          \n# anchor keys used to locate the real dictionary object inside noisy LLM output\
          \n_ANCHOR_KEYS = {\n    \"zh_modern\": (\"definition\", \"pos\", \"example_sentences\"),\
          \n    \"en_en_business\": (\"headword\", \"definitions_en\", \"meaning_zh\"),\
          \n    \"en_zh_bidirectional\": (\"direction_resolved\", \"translation_main\", \"example_sentences\"),\
          \n}\n\n\ndef _pick_raw_by_type(dt, raw_zh, raw_en, raw_enzh):\n    if dt == \"zh_modern\":\
          \n        return (raw_zh or \"\").strip()\n    if dt == \"en_en_business\":\
          \n        return (raw_en or \"\").strip()\n    return (raw_enzh or \"\").strip()\n\n\
          \ndef _strip_wrappers(s: str) -> str:\n    s = (s or \"\").strip()\
          \n    s = re.sub(r\"<think>[\\s\\S]*?</think>\", \"\", s, flags=re.I).strip()\
          \n    s = re.sub(r\"<reasoning>[\\s\\S]*?</reasoning>\", \"\", s, flags=re.I).strip()\
          \n    return s\n\n\ndef _normalize_quotes(s: str) -> str:\n    trans = str.maketrans({\
          \n        \"\\u201c\": '\"', \"\\u201d\": '\"', \"\\u2018\": \"'\", \"\\u2019\": \"'\",\
          \n        \"\\uff02\": '\"', \"\\uff07\": \"'\",\
          \n        \"\\uff5b\": \"{\", \"\\uff5d\": \"}\",\n    })\n    return s.translate(trans)\n\
          \n\ndef _strip_trailing_commas(s: str) -> str:\
          \n    return re.sub(r\",(\\s*[}\\]])\", r\"\\1\", s)\n\n\
          \ndef _balanced_slices(s: str, open_ch=\"{\", close_ch=\"}\"):\
          \n    \"\"\"Yield balanced {...} substrings left-to-right (nested-aware).\"\"\"\
          \n    n = len(s)\n    i = 0\n    while i < n:\n        if s[i] != open_ch:\
          \n            i += 1\n            continue\n        depth = 0\n        in_str = False\
          \n        esc = False\n        quote = \"\"\n        for j in range(i, n):\
          \n            ch = s[j]\n            if in_str:\n                if esc:\
          \n                    esc = False\n                elif ch == \"\\\\\":\
          \n                    esc = True\n                elif ch == quote:\
          \n                    in_str = False\n                continue\
          \n            if ch in ('\"', \"'\"):\n                in_str = True\
          \n                quote = ch\n                continue\n            if ch == open_ch:\
          \n                depth += 1\n            elif ch == close_ch:\n                depth -= 1\
          \n                if depth == 0:\n                    yield s[i : j + 1]\
          \n                    break\n        i += 1\n\n\ndef _try_parse_obj(cand: str):\
          \n    cand = _normalize_quotes(cand).strip()\
          \n    variants = [cand, _strip_trailing_commas(cand)]\n    for v in variants:\
          \n        try:\n            obj = json.loads(v)\n            if isinstance(obj, dict):\
          \n                return obj\n        except Exception:\n            pass\
          \n    for v in variants:\n        try:\n            obj = ast.literal_eval(v)\
          \n            if isinstance(obj, dict):\n                return obj\
          \n        except Exception:\n            pass\n    try:\
          \n        fixed = re.sub(r\"(?<![\\\\])'\", '\"', variants[-1])\
          \n        obj = json.loads(_strip_trailing_commas(fixed))\
          \n        if isinstance(obj, dict):\n            return obj\n    except Exception:\
          \n        pass\n    return None\n\n\ndef _looks_like_echo(text: str) -> bool:\
          \n    t = (text or \"\").lower()\n    needles = [\n        \"no invented abbreviations\",\
          \n        \"standard well-known tech acronyms\",\n        \"names of code symbols\",\
          \n        \"json 硬约束\",\n        \"只输出一个合法 json\",\n        \"你是英汉双向\",\
          \n        \"你是现代汉语\",\n        \"你是商务及深度学习\",\n    ]\
          \n    return any(n in t for n in needles) and (\
          \n        \"direction_resolved\" not in text\n        and \"translation_main\" not in text\
          \n        and '\"definition\"' not in text\n        and '\"definitions_en\"' not in text\
          \n    )\n\n\ndef loads_for_type(raw: str, dt: str):\n    s = _strip_wrappers(raw)\
          \n    if not s:\n        raise ValueError(\"empty LLM text\")\n\
          \n    fence = re.search(r\"```(?:json|JSON)?\\s*([\\s\\S]*?)```\", s)\n    blobs = []\
          \n    if fence:\n        blobs.append(fence.group(1).strip())\n    blobs.append(s)\n\
          \n    anchors = _ANCHOR_KEYS.get(dt, ())\n    required = _REQUIRED_KEYS.get(dt, [])\
          \n    best = None\n    best_score = -1\n    errors = []\n\n    for blob in blobs:\
          \n        # prefer slices that contain an anchor key string\
          \n        slices = list(_balanced_slices(blob))\
          \n        if not slices and blob.strip().startswith(\"{\"):\
          \n            slices = [blob.strip()]\n        # also try whole blob\n        ordered = []\
          \n        for sl in slices:\n            if any(a in sl for a in anchors):\
          \n                ordered.append(sl)\n        for sl in slices:\
          \n            if sl not in ordered:\n                ordered.append(sl)\n\
          \n        for sl in ordered:\n            obj = _try_parse_obj(sl)\
          \n            if not obj:\n                continue\
          \n            # strong-candidate gate: reject weak slices that only share a few keys (e.g. only pos)\
          \n            req_hit = sum(1 for k in required if k in obj)\
          \n            anchors_hit = sum(1 for a in anchors if a in obj)\
          \n            min_req = max(len(anchors), (len(required) * 7 + 9) // 10)  # ~70%\
          \n            if anchors_hit < len(anchors) and req_hit < min_req:\
          \n                continue\n            score = req_hit + anchors_hit * 2\
          \n            if score > best_score:\n                best_score = score\
          \n                best = obj\n\n    if best is not None and best_score > 0:\
          \n        return best\n\n    if _looks_like_echo(s):\n        raise ValueError(\
          \n            \"LLM 未输出词典 JSON，疑似回显了知识库/规则原文（例如 abbreviations 指引）。\"\
          \n            \"请忽略知识库原文，直接输出含 direction_resolved/translation_main 等字段的 JSON。\"\n        )\
          \n\n    # last attempt: whole text as JSON\n    obj = _try_parse_obj(s)\
          \n    if isinstance(obj, dict):\n        return obj\n\
          \n    raise ValueError(\"无法从 LLM 输出中定位合法词典 JSON 对象\")\n\n\
          \ndef main(raw_zh: str, raw_en: str, raw_enzh: str, word: str, route_type: str) -> dict:\
          \n    def fail(code: str, msg: str) -> dict:\n        err = {\n            \"ok\": False,\
          \n            \"error_code\": code,\n            \"message\": msg,\
          \n            \"word\": word or \"\",\n            \"type\": (route_type or \"\").strip(),\
          \n        }\n        return {\"result_json\": json.dumps(err, ensure_ascii=False)}\n\
          \n    dt = (route_type or \"\").strip()\n    if dt not in _ALLOWED:\
          \n        return fail(\"INPUT\", \"type 必须是 zh_modern | en_en_business | en_zh_bidirectional\")\
          \n\n    t = _pick_raw_by_type(dt, raw_zh, raw_en, raw_enzh)\
          \n    if not (t or \"\").strip():\
          \n        return fail(\"PARSE\", \"LLM 输出为空（请确认当前分支 LLM 已执行且三路汇入本节点）\")\n\n    try:\
          \n        payload = loads_for_type(t, dt)\n    except Exception as e:\
          \n        preview = (t or \"\").strip().replace(\"\\n\", \" \")[:180]\
          \n        return fail(\"PARSE\", \"LLM 输出非合法 JSON: \" + str(e) + \" | preview=\" + preview)\
          \n\n    if not isinstance(payload, dict):\
          \n        return fail(\"PARSE\", \"根节点必须是 JSON 对象\")\n\
          \n    required = _REQUIRED_KEYS.get(dt, [])\
          \n    missing = [k for k in required if k not in payload]\n    if missing:\
          \n        present = [k for k in required if k in payload]\
          \n        preview = str(list(payload.keys())[:12])\n        return fail(\
          \n            \"VALIDATE\",\
          \n            f\"LLM 返回 JSON 缺少 {len(missing)} 个必须字段: {', '.join(missing)}。\"\
          \n            f\"已有: {', '.join(present) or '(无)'}。keys={preview}。\"\
          \n            f\"请检查英汉双向·LLM 原始输出是否完整，或是否误选了残缺 JSON 片段。\",\n        )\n\
          \n    out = {\"ok\": True, \"type\": dt, \"payload\": payload}\
          \n    return {\"result_json\": json.dumps(out, ensure_ascii=False)}\n"
