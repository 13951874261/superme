    - data:
        code: "import urllib.parse\n\ndef main(word: str) -> dict:\n    w = (word or \"\").strip().lower()\n    url = f\"https://dictionary.cambridge.org/dictionary/english-chinese-simplified/{urllib.parse.quote(w)}\"\n    return {\n        \"cambridge_url\": url,\n        \"word\": w\n    }\n"
        code_language: python3
        desc: 将输入的词条构造为 Cambridge 词典 URL
        outputs:
          cambridge_url:
            children: null
            type: string
          word:
            children: null
            type: string
        selected: false
        title: 构造Cambridge URL
        type: code
        variables:
        - value_selector:
          - a1000000-0000-4000-8000-000000000001
          - word
          value_type: string
          variable: word
      height: 88
      id: c0000001-0000-4000-8000-000000000001
      position:
        x: 342
        y: 0
      positionAbsolute:
        x: 342
        y: 0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: body-url
            key: url
            type: text
            value: '{{#c0000001-0000-4000-8000-000000000001.cambridge_url#}}'
          type: raw-text
        desc: 调用后端 /api/materials/fetch-url 获取 Cambridge 词典页面的 markdown 内容
        headers: Content-Type:application/json
        method: post
        params: ''
        retry_config:
          enabled: true
          max_retries: 3
          retry_interval: 200
        selected: false
        ssl_verify: true
        timeout:
          connect: 10
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
          read: 60
          write: 30
        title: 获取Cambridge Markdown
        type: http-request
        url: https://app.liujingzhuwo.site/api/materials/fetch-url
        variables: []
      height: 120
      id: h0000001-0000-4000-8000-000000000001
      position:
        x: 684
        y: 0
      positionAbsolute:
        x: 684
        y: 0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "import re\nimport json\n\ndef clean_md(value):\n    text = str(value or '')\n    text = re.sub(r'\\\\[(.+?)\\\\]\\\\([^)]+\\\\)', r'\\\\1', text)\n    text = re.sub(r'\\\\[\\\\[(.+?)\\\\]\\\\]\\\\([^)]+\\\\)', r'[$1]', text)\n    text = re.sub(r'\\\\((https?:\\\\/\\\\/[^)]+)\\\\)', '', text)\n    text = text.replace('\\\\\\\\', '')\n    return text.replace('*', '').replace('_', '').replace('`', '').replace('#', '').strip()\n\ndef split_en_zh(value):\n    text = clean_md(value)\n    for i, c in enumerate(text):\n        if '\\\\u3400' <= c <= '\\\\u9fff':\n            return text[:i].strip(), text[i:].strip()\n    return text, ''\n\ndef extract_pos_info(heading):\n    pos_words = ['phrasal verb', 'modal verb', 'adjective', 'adverb', 'noun', 'verb', 'pronoun', 'preposition', 'conjunction', 'exclamation', 'determiner']\n    pos = ''\n    label = ''\n    headword = ''\n    for p in pos_words:\n        p_esc = re.escape(p)\n        m = re.search(r'^(.+?)\\\\s*' + p_esc + r'\\\\s*\\\\(([^)]+)\\\\)', heading, re.I)\n        if m:\n            pos, label, headword = p.lower(), m.group(2).strip(), m.group(1).strip()\n            return pos, label, headword\n        m = re.search(r'^(?:' + p_esc + r')\\\\s*\\\\(([^)]+)\\\\)', heading, re.I)\n        if m:\n            pos, label = p.lower(), m.group(1).strip()\n            return pos, label, headword\n        m = re.search(r'^(.+?)\\\\s*' + p_esc + r'\\\\b', heading, re.I)\n        if m and len(m.group(1)) > 0:\n            pos, headword = p.lower(), m.group(1).strip()\n            return pos, label, headword\n        m = re.search(r'^(?:' + p_esc + r')\\\\s+([A-Z]+)\\\\s*$', heading, re.I)\n        if m:\n            pos, label = p.lower(), m.group(1).strip()\n            return pos, label, headword\n        m = re.search(r'^(?:' + p_esc + r')$', heading, re.I)\n        if m:\n            pos = p.lower()\n            return pos, label, headword\n    return pos, label, headword\n\ndef is_valid_def(en_text):\n    if len(en_text) < 5:\n        return False\n    if en_text.startswith('['):\n        return False\n    if re.match(r'^[A-Z\\\\s]+$', en_text) and len(en_text) < 20:\n        return False\n    bad = ['add to word list', 'your browser', 'translation of', 'dictionary.cambridge', 'cambridge.org', 'vibenoun', 'noun', 'verb', 'adj', 'adv', 'plural', 'singular', 'past tense', 'past participle', 'present participle', 'third person singular', 'comparative', 'superlative']\n    return not any(p in en_text.lower() for p in bad)\n\ndef main(markdown_raw: str, word: str) -> dict:\n    md = str(markdown_raw or '').strip()\n    if not md:\n        return {\"result_json\": json.dumps({\"error\": \"empty\"}, ensure_ascii=False)}\n    \n    source = re.split(r'^## Examples of', md, flags=re.I)[0]\n    \n    uk_match = re.search(r'\\\\buk\\\\b([\\\\s\\\\S]*?)(?=^###\\\\s)', source, re.M)\n    pron_block = uk_match.group(1) if uk_match else ''\n    pron_matches = re.findall(r'(\\\\/[^\\\\/\\\\n]+\\\\/)(?:us\\\\b)?', pron_block)\n    phonetic_uk = pron_matches[0] if len(pron_matches) > 0 else ''\n    phonetic_us = pron_matches[1] if len(pron_matches) > 1 else ''\n    \n    all_senses = []\n    sense_starts = []\n    for m in re.finditer(r'^###\\\\s+', source, re.M):\n        sense_starts.append(m.start())\n    \n    for idx, start in enumerate(sense_starts):\n        end = sense_starts[idx+1] if idx+1 < len(sense_starts) else len(source)\n        block = source[start:end]\n        lines = block.split('\\\\n')\n        \n        heading_raw = lines[0].strip()\n        heading = clean_md(heading_raw)\n        \n        pos, label, headword = extract_pos_info(heading)\n        \n        level = ''\n        lm = re.search(r'\\\\b(A1|A2|B1|B2|C1|C2)\\\\b', heading, re.I)\n        if lm:\n            level = lm.group(1)\n        \n        grammar = re.findall(r'\\\\[(?:\\\\s*)?([CU])(?:\\\\s*)?\\\\]', heading)\n        \n        content_lines = lines[1:]\n        definition_en = ''\n        definition_zh = ''\n        examples = []\n        register = ''\n        \n        for line in content_lines:\n            lc = clean_md(line)\n            if not lc:\n                continue\n            if re.match(r'^/(?:[^\\\\n/]+)//(?:us|uk)?$', lc):\n                continue\n            if re.match(r'^(uk|us)\\\\b', lc, re.I):\n                continue\n            if 'Add to word list' in lc:\n                continue\n            if lc.lower().startswith('your browser'):\n                continue\n            if lc.startswith('(') and 'Translation' in lc and lc.endswith(')'):\n                continue\n            \n            rm = re.search(r'\\\\b(formal|informal|literary|slang|old-fashioned|approving|disapproving)\\\\b', lc, re.I)\n            if rm and not register:\n                register = rm.group(1).lower()\n            \n            if re.match(r'^[\\\\u3400-\\\\u9fff]+$', lc):\n                definition_zh = lc\n                continue\n            \n            en, zh = split_en_zh(lc)\n            if en and re.search(r'[A-Za-z]', en):\n                if is_valid_def(en):\n                    if not definition_en and len(en) > 5:\n                        definition_en = en\n                        definition_zh = zh or ''\n                    elif len(examples) < 4 and len(en) > 15:\n                        examples.append({'en': en, 'zh': zh or ''})\n        \n        if definition_en or definition_zh:\n            all_senses.append({\n                'headword': headword if headword else None,\n                'part_of_speech': pos,\n                'label': label,\n                'level': level,\n                'grammar': grammar,\n                'register': register,\n                'definition_en': definition_en,\n                'translation_zh': definition_zh,\n                'examples': examples\n            })\n    \n    example_sentences = []\n    seen = set()\n    for line in source.split('\\\\n'):\n        lc = clean_md(line)\n        en, zh = split_en_zh(lc)\n        if en and en not in seen and re.search(r'[A-Za-z]{3,}', en) and len(en) > 15:\n            if is_valid_def(en):\n                seen.add(en)\n                example_sentences.append({'en': en, 'zh': zh or ''})\n        if len(example_sentences) >= 6:\n            break\n    \n    idioms = []\n    idiom_section = re.search(r'###\\\\s+\\\\*\\\\*?Idioms\\\\*\\\\*?([\\\\s\\\\S]*?)(?=^##|\\\\Z)', source, re.I | re.S)\n    if idiom_section:\n        for il in re.findall(r'\\\\[(.+?)\\\\]\\\\(https://[^)]+\\\\)', idiom_section.group(1)):\n            il_clean = clean_md(il)\n            if il_clean and il_clean.lower() not in ('meaning', 'dictionary', 'cambridge'):\n                idioms.append(il_clean)\n    \n    core_def = all_senses[0] if all_senses else {}\n    result = {\n        'headword': (word or '').strip(),\n        'core_definition': core_def,\n        'cambridge_details': {'phonetic_uk': phonetic_uk, 'phonetic_us': phonetic_us, 'senses': all_senses},\n        'example_sentences': example_sentences[:6],\n        'collocations_and_extensions': {'collocations': [], 'idioms': idioms}\n    }\n    return {'result_json': json.dumps(result, ensure_ascii=False)}\n"
        code_language: python3
        desc: 解析 Cambridge markdown，提取四部分内容：核心释义 / Cambridge详情（音标+词性+释义）/ 例句 / 搭配与扩展（idioms+collocations）
        outputs:
          result_json:
            children: null
            type: string
        selected: false
        title: 解析Cambridge Markdown
        type: code
        variables:
        - value_selector:
          - h0000001-0000-4000-8000-000000000001
          - body
          value_type: string
          variable: markdown_raw
        - value_selector:
          - c0000001-0000-4000-8000-000000000001
          - word
          value_type: string
          variable: word
      height: 128
      id: c0000002-0000-4000-8000-000000000001
      position:
        x: 1026
        y: 0
      positionAbsolute:
        x: 1026
        y: 0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        desc: 工作流对外输出；API 读取 outputs.result。
        outputs:
        - value_selector:
          - c0000002-0000-4000-8000-000000000001
          - result_json
          variable: result
        selected: false
        title: 结束
        type: end
      height: 88
      id: a1000000-0000-4000-8000-000000000004
      position:
        x: 1368
        y: 0
      positionAbsolute:
        x: 1368
        y: 0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
  viewport:
    x: 0
    y: 0
    zoom: 1.0
