app:
  description: 跨国高管听辨与弦外之音解析引擎。深度剖析听力材料中的表面含义、权力结构与潜台词。
  icon: 🎧
  icon_background: '#EAF4FF'
  icon_type: emoji
  mode: workflow
  name: Listening_Comparison_Engine_Fixed
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.53@a0dfb462961a03c6a6415d4185043185b01017c64da93cf82a9e5ecaf59f8ed0
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 1024
        batch_count_limit: 5
        file_size_limit: 1024
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 1024
        single_chunk_attachment_limit: 10
        video_file_size_limit: 1024
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: start-llm
      selected: false
      source: start
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: answer
      id: llm-answer
      selected: false
      source: llm
      sourceHandle: source
      target: end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: user_input
          max_length: 50000
          options: []
          required: true
          type: paragraph
          variable: user_input
        - label: standard_text
          max_length: 50000
          options: []
          required: true
          type: paragraph
          variable: standard_text
        - default: ''
          hint: ''
          label: 阵地主题(theme)
          max_length: 256
          options: []
          placeholder: ''
          required: true
          type: text-input
          variable: theme
        - default: ''
          hint: ''
          label: user_current_profile
          options: []
          placeholder: ''
          required: false
          type: paragraph
          variable: user_current_profile
      height: 187
      id: start
      position:
        x: 0
        y: 0
      positionAbsolute:
        x: 0
        y: 0
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: '109'
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: system
          role: system
          text: "你是一位顶级的跨国企业行为心理学专家与高级英语听力教练。\n用户将进行“精听盲听”训练。你将接收到两段文本：一段是用户盲听后口述的【用户草稿】，另一段是真实的【标准原文】。\n\
            \n【画像自适应听力诊断约束】\n当前学习者的国家/地区画像背景为：{{user_current_profile}}\n在对用户听写进行差异比对并生成分析时，必须根据该画像对齐发音口音特征与文字规范：\n\
            \n1. 口音与听辨偏误成因诊断（用于 JSON 中的 \"comparison.errors[].reason\" 字段）：\n   -\
            \ 如果 {{user_current_profile}} 包含 \"英国\" 或 \"UK\"，当用户听写出现漏听、误听时，必须针对英音的发音特性进行对比剖析：\n\
            \     * 分析非卷舌音 (Non-rhoticity) 规则：指出英音中辅音字母 /r/ 在元音后不发音（如 teacher 结尾不发卷舌音），容易造成漏听或误听为长元音的现象。\n\
            \     * 分析元音发音差异：针对英音 RP 中的 /ɒ/ 或 /ɑː/ 等发音（如 hot, bath），分析用户由于中美发音习惯差异导致的听力误差。\n\
            \   - 如果画像为美区或默认，则从美式的闪音（T-flapping）、弱读与辅音浊化等美音规律切入诊断。\n2. 拼写风格自适应（用于\
            \ JSON 中的 \"comparison.coach_comment\" 和 \"subtext_analysis.key_jargons[].meaning\"\
            \ 字段）：\n   - 提取的专业黑话释义以及教练总评文本，当画像包含 \"英国\" 或 \"UK\" 时，所有输出的英文表达必须严格对齐英式拼写规范（如\
            \ colour, programme, analyse, organise 等）。\n\n【输入信息】\n【用户草稿】（What the\
            \ user heard）：\n{{user_input}}\n\n【标准原文】（The actual transcript）：\n{{standard_text}}\n\
            \n【当前阵地主题】：\n{{theme}}\n\n【任务目标】\n第一步【听辨比对】：对比两者的差异，指出用户在哪里漏听、错听（特别是连读、弱读或生僻词，对齐画像规律）。\n\
            第二步【弦外之音】：对【标准原文】“剥开表面看本质”，解析其中的弦外之音（Subtext）、权力动态和高阶黑话。\n\n【输出要求】\n必须返回合法的\
            \ JSON 格式，直接输出大括号包裹的内容（绝不可有 ```json 的 markdown 标记）。\n返回的 JSON 结构必须严格如下：\n\
            {\n  \"comparison\": {\n    \"accuracy_score\": \"用户听写准确率（如 85%）\",\n\
            \    \"errors\": [\n      {\n        \"user_heard\": \"用户听错的词/句\",\n \
            \       \"actual_words\": \"正确的词/句\",\n        \"reason\": \"错误原因分析（如：英音元音偏差、连读失音、词汇不熟等，对齐画像口音规则描述）\"\
            \n      }\n    ],\n    \"coach_comment\": \"给用户的一句简短鼓励或听力提升建议（贴合画像拼写规则）\"\
            \n  },\n  \"subtext_analysis\": {\n\n【比对绝对性约束（极度重要）】\n1. errors 数组中的每一个 \"actual_words\" 必须完全且严格摘自真实的【标准原文】（standard_text）。禁止出现任何拼写变体、多余的词或者虚构的语境。\n2. 如果用户草稿中某些单词听错了，替换为 standard_text 中的对应正确单词时，请务必保持大小写与 standard_text 中一致。\n3. 绝对不能凭空捏造 standard_text 之外的文章片段进行分析。\n    \"surface_meaning\": \"原文的字面意思摘要\"\
            ,\n    \"hidden_subtext\": \"弦外之音剖析（深层权力博弈、情绪或真实意图）\",\n    \"power_dynamics\"\
            : \"当前对话中的同盟、施压或阻力关系分析\",\n    \"key_jargons\": [\n      { \"word\": \"\
            黑话/短语\", \"meaning\": \"在此语境下的真实商务含义（拼写对齐画像要求）\" }\n    ]\n  }\n}\n\n\
            【系统隐性约束】\n请结合背景大环境【{{theme}}】，深度剖析对话双方的 hidden_subtext (潜台词) 与 power_dynamics\
            \ (权力动态)。不要做泛泛而谈，必须与该背景下的利益冲突强绑定。"
        - id: c768257a-5cdf-4c33-bb68-8c3b8adc455c
          role: user
          text: 'user_input: {{user_input}}

            standard_text: {{standard_text}}

            theme: {{theme}}

            user_current_profile: {{user_current_profile}}'
        selected: true
        title: 弦外之音解析引擎
        type: llm
