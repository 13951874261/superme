app:
  description: 跨国高管级别英文书面表达的三段式残酷批阅引擎（改造版，输出包含 optimized_version 并拉通 theme）。
  icon: ✒️
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: English_Writing_Review
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.53@a0dfb462961a03c6a6415d4185043185b01017c64da93cf82a9e5ecaf59f8ed0
    version: null
kind: app
version: 0.6.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions: []
      allowed_file_types: []
      allowed_file_upload_methods: []
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 1024
        batch_count_limit: 5
        file_size_limit: 1024
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 1024
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        sourceType: start
        targetType: llm
      id: edge-start-llm
      source: start_node
      sourceHandle: source
      target: llm_node
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        sourceType: llm
        targetType: end
      id: edge-llm-end
      source: llm_node
      sourceHandle: source
      target: end_node
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables:
        - label: user_text
          max_length: 4000
          options: []
          required: true
          type: paragraph
          variable: user_text
        - label: mail_intent
          max_length: 256
          options: []
          required: true
          type: text-input
          variable: mail_intent
        - default: ''
          hint: ''
          label: 阵地主题(theme)
          max_length: 256
          options: []
          placeholder: ''
          required: true
          type: text-input
          variable: theme
        - label: 引用知识上下文
          max_length: 20000
          options: []
          required: false
          type: paragraph
          variable: knowledge_context
      height: 161
      id: start_node
      position:
        x: 78
        y: 282
      positionAbsolute:
        x: 78
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: ''
        model:
          completion_params:
            temperature: 0.2
          mode: chat
          name: 'gemini-1.5-pro-latest'
          provider: google
        prompt_template:
        - id: system_prompt
          role: system
          text: |
            你是一个顶级的企业沟通教练、体制内公文专家和商业战略顾问。你的任务是根据用户输入的材料类型、全局当日学习主题（theme）以及具体内容，进行三段式纵深批改并自动生成一篇针对该主题的高水准改写示例（optimized_version）。

            输入参数说明：
            - user_text: 待批阅的原文
            - mail_intent: 用户意图（如施压、让步、寻求共识）
            - theme: 当前学习主题（将影响 L3 的战略站位判断与改写范文的语境）
            - 请遵守任何 additional constraints 来调整输出风格或字数

            输出要求（严格 JSON）：
            对于企业公文类（三段式批阅）请输出如下 JSON：
            {
              "L1": "表层语法与措辞纠错与建议",
              "L2": "商务分寸与逻辑结构建议",
              "L3": "战略站位与政治/合规层面点评",
              "optimized_version": "一段针对 theme 的高质量英文改写示例（供用户学习/采纳），请以正式商务邮件/公文风格输出"
            }

            说明：
            - 返回必须为纯 JSON 字符串，不得包含 markdown 代码块（如 ```json）或额外注释。
            - optimized_version 请与 theme 保持语义一致，并体现 mail_intent 的写作目的与分寸把控。
            - 对于其他 task_type（如 business_writing/value_proposal），请保持类似结构并包含 optimized_version 字段。

        - id: user_prompt
          role: user
          text: 'mail_intent: {{#start_node.mail_intent#}}\n\nuser_text: {{#start_node.user_text#}}\n\ntheme: {{#start_node.theme#}}\n\nknowledge_context: {{#start_node.knowledge_context#}}\n以下为用户已确认同步的知识，仅作补充，不得编造未提供的条目。若为空则忽略。'
        selected: false
        title: 三段式残酷批阅
        type: llm
        variables: []
        vision:
          enabled: false
      height: 220
      id: llm_node
      position:
        x: 380
        y: 282
      positionAbsolute:
        x: 380
        y: 282
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        desc: ''
        outputs:
        - value_selector:
          - llm_node
          - text
          variable: result
        selected: false
        title: 结束
        type: end
      height: 88
      id: end_node
      position:
        x: 681
        y: 282
      positionAbsolute:
        x: 681
        y: 282
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: 112.35903299763714
      y: 24.05160609277823
      zoom: 0.8705505632961241
  rag_pipeline_variables: []
