    - data:
        code: "import math\n\n\ndef main(retrieved_docs: list, current_timestamp:\
          \ int) -> dict:\n    # 学习兴趣标签的半衰期设为 7 天\n    # 用户的学习兴趣变化较为频繁，7天的半衰期可以保证推荐内容紧跟近期的学习热点\n\
          \    HALF_LIFE_MS = 7 * 24 * 60 * 60 * 1000\n    decay_rate = math.log(2)\
          \ / HALF_LIFE_MS\n\n    reranked_docs = []\n\n    if not retrieved_docs:\n\
          \        return {\"reranked_context\": \"\"}\n\n    ts = int(current_timestamp)\
          \ if current_timestamp is not None else 0\n\n    for doc in retrieved_docs:\n\
          \        if not isinstance(doc, dict):\n            continue\n        content\
          \ = doc.get(\"content\", \"\")\n        orig_score = float(doc.get(\"score\"\
          , 0.5))\n        metadata = doc.get(\"metadata\", {}) or {}\n\n        #\
          \ 获取用户兴趣标签的记录时间戳\n        doc_time = int(metadata.get(\"updated_at\", ts\
          \ - HALF_LIFE_MS))\n\n        time_diff = max(0, ts - doc_time)\n      \
          \  decay_factor = math.exp(-decay_rate * time_diff)\n        final_score\
          \ = orig_score * decay_factor\n\n        doc_age_days = round(time_diff\
          \ / (24 * 60 * 60 * 1000))\n        time_tag = f\"[该兴趣记录于：{doc_age_days}\
          \ 天前]\"\n\n        reranked_docs.append({\n            \"content\": f\"\
          {time_tag} {content}\",\n            \"final_score\": final_score,\n   \
          \         \"metadata\": metadata\n        })\n\n    # 根据时间衰减后的分数重新降序排序\n\
          \    reranked_docs.sort(key=lambda x: x[\"final_score\"], reverse=True)\n\
          \n    # 拼接为纯文本供 LLM 使用\n    merged_context = \"\\n\\n---\\n\\n\".join([d[\"\
          content\"] for d in reranked_docs])\n\n    return {\n        \"reranked_context\"\
          : merged_context\n    }\n"
        code_language: python3
        desc: 对知识检索结果按 7 天半衰期做时间衰减重排，并为每段兴趣标签注入「该兴趣记录于 X 天前」标签。
