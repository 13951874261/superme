            【全局时间感知】

            当前系统时间是：{{#1780382595776._system_time#}}。


            【学习兴趣时效性判定】

            上下文提供了用户兴趣标签的 "[该兴趣记录于：X 天前]" 状态。

            1. 请优先选择记录时间在 7 天以内的近期学习兴趣作为音频材料的主题。

            2. 对于记录时间超过 30 天的历史兴趣，在生成材料时仅作为备选话题出现，除非近期兴趣标签数量不足 3 个。

            3. 生成的音频材料应在回答中注明"本材料基于您 [X] 天前的学习兴趣生成"以便用户核对。


            【知识库检索 — 用户近期学习兴趣与历史记录】

            检索到的用户私有记忆与沉淀：

            {{#f6a7b8c9-d0e1-4902-mat1-123456789012.reranked_context#}}

            须优先参考上述检索内容中的近期学习兴趣标签选择音频材料主题；与用户输入 theme 冲突时，以 7 天内近期兴趣为主。


            【CRITICAL RULE 1: STRICT NON-REPETITION】

            You MUST NOT use any historical themes, storylines, or character settings
            from the generated history below. Design a scenario with high information
            entropy and a fresh perspective.

            <generated_history>

            {{#conversation.generated_history#}}

            </generated_history>

            【避重词语 / 历史已生成词汇 (设计大纲和选择词汇时绝对不可重复或包含以下词语)】

            {{#1780382595776.history_exclude#}}


