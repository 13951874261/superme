        code: "import json\nimport ast\nimport re\n\ndef _kb_to_text(kb_result) -> str:\n    if\
          \ not kb_result:\n        return \"\"\n    if isinstance(kb_result, str):\n\
          \        return kb_result.strip()\n    lines = []\n    items = kb_result\
          \ if isinstance(kb_result, list) else []\n    for i, item in enumerate(items[:8]):\n\
          \        if isinstance(item, dict):\n            content = item.get(\"content\"\
          ) or item.get(\"text\") or \"\"\n            title = item.get(\"title\"\
          ) or item.get(\"document_name\") or \"\"\n            line = str(content).strip()\
          \ or str(title).strip()\n        else:\n            line = str(item).strip()\n\
          \        if line:\n            lines.append(f\"{i + 1}. {line[:500]}\")\n\
          \    return \"\\n\".join(lines)\n\ndef _extract_pack(raw) -> str:\n   \
          \ if raw is None:\n        return \"\"\n    if isinstance(raw, dict):\n\
          \        if raw.get(\"success\") and raw.get(\"data\"):\n            return\
          \ str(raw[\"data\"].get(\"text\") or \"\").strip()\n        return str(raw.get(\"\
          data\", {}).get(\"text\") or raw.get(\"text\") or \"\").strip()\n    if\
          \ isinstance(raw, (bytes, bytearray)):\n        return raw.decode(\"utf-8\"\
