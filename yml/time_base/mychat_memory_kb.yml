          \ = \"http://api:5001\"\n\ndef main(llm_json: str, user_id: str) -> dict:\n\
          \    empty = {\n        \"do_post\": 0,\n        \"doc_name\": \"\",\n \
          \       \"doc_text\": \"\",\n        \"api_body\": \"\",\n        \"kb_pending_record\"\
          : \"\",\n        \"memory_ingest_body\": \"\",\n    }\n    if llm_json is\
          \ None:\n        return empty\n    if isinstance(llm_json, dict):\n    \
          \    if \"save\" in llm_json or (\"title\" in llm_json and \"text\" in llm_json):\n\
          \            data = llm_json\n        elif \"llm_json\" in llm_json:\n \
          \           inner = llm_json[\"llm_json\"]\n            if isinstance(inner,\
          \ dict):\n                data = inner\n            else:\n            \
          \    raw = str(inner).strip().lstrip(\"\\ufeff\")\n                try:\n\
          \                    data = json.loads(raw)\n                except Exception:\n\
          \                    return empty\n        else:\n            return empty\n\
          \    else:\n        raw = str(llm_json).strip().lstrip(\"\\ufeff\")\n  \
          \      if raw.startswith(_FENCE):\n            lines = raw.split(\"\\n\"\
          )\n            if lines and lines[0].startswith(_FENCE):\n             \
          \   lines = lines[1:]\n            if lines and lines[-1].strip() == _FENCE:\n\
          \                lines = lines[:-1]\n            raw = \"\\n\".join(lines).strip()\n\
          \        try:\n            data = json.loads(raw)\n        except Exception:\n\
          \            return empty\n    if (\n        isinstance(data, dict)\n  \
          \      and \"llm_json\" in data\n        and data.get(\"save\") is None\n\
          \    ):\n        inner = data[\"llm_json\"]\n        if isinstance(inner,\
          \ dict):\n            data = inner\n        else:\n            try:\n  \
          \              data = json.loads(str(inner).strip().lstrip(\"\\ufeff\"))\n\
          \            except Exception:\n                return empty\n    if not\
          \ isinstance(data, dict) or not data.get(\"save\"):\n        return empty\n\
          \    title = str(data.get(\"title\") or \"会话摘要\").strip()[:120]\n    text\
          \ = str(data.get(\"text\") or \"\").strip()\n    if not text:\n        return\
          \ empty\n    # 与 Apifox 已验证通过的 create-by-text 请求体一致（勿带 original_document_id\
          \ 占位）\n    payload = {\n        \"name\": title,\n        \"text\": text,\n\
          \        \"indexing_technique\": \"high_quality\",\n        \"doc_form\"\
          : \"text_model\",\n        \"doc_language\": \"Chinese\",\n        \"embedding_model\"\
          : \"bge-small-zh-v1.5\",\n        \"embedding_model_provider\": \"langgenius/xinference/xinference\"\
          ,\n        \"process_rule\": {\"mode\": \"automatic\"},\n    }\n    pending\
          \ = {\n        \"kind\": \"dify_dataset_create_by_text\",\n        \"dataset_id\"\
          : _DATASET_ID,\n        \"create_by_text_url\": (\n            _API_BASE\
          \ + \"/v1/datasets/\" + _DATASET_ID + \"/document/create-by-text\"\n   \
          \     ),\n        \"method\": \"POST\",\n        \"body\": payload,\n  \
          \  }\n    uid = (user_id or \"default-user\").split(\"@\")[0].strip() or\
          \ \"default-user\"\n    memory_ingest_payload = {\n        \"userId\": uid,\n\
          \        \"source\": \"mychat_memory_kb\",\n        \"sessionSummary\":\
          \ {\n            \"title\": title,\n            \"summary\": text,\n   \
          \         \"session_id\": \"\",\n        },\n        \"promoteToEpisode\"\
          : True,\n    }\n    return {\n        \"do_post\": 1,\n        \"doc_name\"\
          : title,\n        \"doc_text\": text,\n        \"api_body\": json.dumps(payload,\
          \ ensure_ascii=False),\n        \"kb_pending_record\": json.dumps(pending,\
          \ ensure_ascii=False),\n        \"memory_ingest_body\": json.dumps(memory_ingest_payload,\
          \ ensure_ascii=False),\n    }\n"
