            \ 或 \"UK\"，针对涉及西式高端社交（如红酒品鉴、高尔夫轻商务、古典音乐与歌剧）的场景，实施极其严格的正统西式社交风控评估。\n   -\
            \ 审查用户的行为和话术是否符合英伦圈层所推崇的“克制”、“绝对的边界意识”与“低调高雅（Understatement）”，扣除带有明显美式炫耀色彩或粗俗词汇的得分。\n\
