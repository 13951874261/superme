app:
  description: 每日发音与语法唤醒 (Wakeup Engine)
  icon: 🌅
  icon_background: '#FFEAD5'
  icon_type: emoji
  mode: workflow
  name: english_wakeup_routine
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai_api_compatible:0.0.53@a0dfb462961a03c6a6415d4185043185b01017c64da93cf82a9e5ecaf59f8ed0
    version: null
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        attachment_image_file_size_limit: 2
        audio_file_size_limit: 1024
        batch_count_limit: 5
        file_size_limit: 1024
        file_upload_limit: 20
        image_file_batch_limit: 10
        image_file_size_limit: 1024
        single_chunk_attachment_limit: 10
        video_file_size_limit: 1024
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: llm
      id: wakeup-start-llm
      source: wakeup_start
      sourceHandle: source
      target: wakeup_llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
      id: wakeup-llm-code
      source: wakeup_llm
      sourceHandle: source
      target: wakeup_code
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: end
      id: wakeup-code-end
      source: wakeup_code
      sourceHandle: source
      target: wakeup_end
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        selected: false
        title: 用户输入
        type: start
        variables:
        - default: ''
          hint: ''
          label: 学习主题(e.g.银团贷款)
          max_length: 256
          options: []
          placeholder: ''
          required: true
          type: text-input
          variable: theme
        - default: ''
          hint: ''
          label: 历史避重列表
          max_length: 65535
          options: []
          placeholder: ''
          required: false
          type: paragraph
          variable: history_exclude
        - default: ''
          hint: ''
          label: user_current_profile
          options: []
          placeholder: ''
          required: false
          type: paragraph
          variable: user_current_profile
      height: 161
      id: wakeup_start
      position:
        x: 80
        y: 240
      positionAbsolute:
        x: 80
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            temperature: 0.3
          mode: chat
          name: '111'
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: wakeup-system-prompt
          role: system
          text: "你是一个极简的「发音与语法」唤醒排版引擎。请根据当前主题与用户地区画像生成严格 JSON。\n\n【输入变量】\n- 当前主题：{{theme}}\n\
            - 避重词汇（绝对不能输出这些单词）：{{history_exclude}}\n- 画像背景：{{user_current_profile}}\n\
            \n【画像自适应生成约束】\n当前跟读学习者的地区画像设定为：{{user_current_profile}}\n你在生成单词音标、英文释义例句以及语法重点解析时，必须高度对齐该画像的语言偏好与书写风格：\n\
            1. 国际音标 (IPA) 生成自适应 (对于 JSON 中的 \"vocab[].ipa\" 字段)：\n   - 如果 {{user_current_profile}}\
            \ 包含 \"英国\" 或 \"UK\"，词包中的单词音标 \"ipa\" 必须使用标准的英式国际音标 (IPA-UK)。例如单词 \"schedule\"\
            \ 标记为 \"ˈʃedj.uːl\" 或 \"ˈʃedʒ.uːl\" (而非美音 \"ˈskedʒ.uːl\")。\n   - 否则，默认使用美式国际音标\
            \ (IPA-US) 标准。\n2. 字形拼写与场景习惯自适应 (对于 JSON 中的 \"vocab[].example\"、\"grammar.explanation\"\
            、\"grammar.examples\" 字段)：\n   - 如果 {{user_current_profile}} 包含 \"英国\"\
            \ 或 \"UK\"，所有的单词拼写、例句和语法原理解析，均应严格遵循英式拼写规范（使用 organise, favour, grey, modelling,\
            \ programme 等字形）。\n3. 发音与口音提示定制 (对于 JSON 中的 \"vocab[].pronunciation_note\"\
            \ 字段)：\n   - 如果 {{user_current_profile}} 包含 \"英国\" 或 \"UK\"，在 \"pronunciation_note\"\
            \ 中提供英音的独有发音特征与口腔阻尼要领提示（例如：指出无卷舌音特征、元音开口度偏深、或注意辅音 /t/ 的清晰爆破，不可像美式闪音那样过度浊化等）。\n\
            \   - 如果为其他地区，则提供对应的美音发音（如卷舌音 /r/、T-flapping 浊化等）规律点评。\n\n注意：\n- vocab\
            \ 里的 word 必须是英文单词或英文短语，禁止输出中文词作为 word。\n- meaning_zh 只能输出中文释义。\n- example\
            \ 必须是英文句子，并且与主题高度相关。\n- 词条应优先选择适合 TTS 朗读的商务高频词。\n\n输出结构必须完全符合以下 JSON 格式：\n\
            {\n  \"theme\": \"主题名\",\n  \"vocab\": [\n    {\n      \"word\": \"英文单词或短语\"\
            ,\n      \"ipa\": \"音标（对齐画像国际音标）\",\n      \"pronunciation_note\": \"\
            发音注意点与口音提示（使用画像习惯拼写）\",\n      \"meaning_zh\": \"中文释义\",\n      \"example\"\
            : \"英文例句（拼写对齐画像）\"\n    }\n  ],\n  \"grammar\": {\n    \"point\": \"1\
            \ 个关联语法点\",\n    \"explanation\": \"简要说明与解析（使用画像习惯拼写）\",\n    \"examples\"\
            : [\n      {\n        \"correct\": \"正确英文用法（拼写对齐画像）\",\n        \"incorrect\"\
            : \"错误英文用法\"\n      }\n    ]\n  }\n}\n\n约束：\n- vocab 必须恰好 10 个词。\n- 仅输出\
            \ JSON，不要 Markdown，不要解释文字。\n- 语法点只保留 1 个，例子至少 1 组。"
        - id: a4ace364-eeb4-4f07-b8cd-ea3b8c68e3ef
          role: user
          text: 'theme: {{theme}}

            history_exclude: {{history_exclude}}

            user_current_profile: {{user_current_profile}}'
        selected: true
        title: LLM 引擎
        type: llm
        vision:
          enabled: false
      height: 88
      id: wakeup_llm
      position:
        x: 380
        y: 240
      positionAbsolute:
        x: 380
        y: 240
      selected: true
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: "import json\n\n\ndef main(llm_text: str) -> dict:\n    raw = (llm_text\
          \ or '').strip()\n    if raw.startswith('```json'):\n        raw = raw[len('```json'):].strip()\n\
          \    if raw.startswith('```'):\n        raw = raw[len('```'):].strip()\n\
          \    if raw.endswith('```'):\n        raw = raw[:-3].strip()\n\n    try:\n\
          \        parsed = json.loads(raw)\n        if isinstance(parsed, dict):\n\
          \            result = parsed\n        else:\n            result = {'theme':\
          \ '', 'vocab': parsed, 'grammar': {'point': '', 'explanation': '', 'examples':\
          \ []}}\n\n        if 'theme' not in result:\n            result['theme']\
          \ = ''\n        if 'vocab' not in result or not isinstance(result['vocab'],\
          \ list):\n            result['vocab'] = []\n        if 'grammar' not in\
          \ result or not isinstance(result['grammar'], dict):\n            result['grammar']\
          \ = {'point': '', 'explanation': '', 'examples': []}\n\n        return {\n\
          \            'clean_json': json.dumps(result, ensure_ascii=False),\n   \
          \         'theme': str(result.get('theme', ''))\n        }\n    except Exception:\n\
          \        return {\n            'clean_json': json.dumps({'theme': '', 'vocab':\
          \ [], 'grammar': {'point': '', 'explanation': '', 'examples': []}}, ensure_ascii=False),\n\
          \            'theme': ''\n        }"
        code_language: python3
        outputs:
          clean_json:
            children: null
            type: string
          theme:
            children: null
            type: string
        selected: false
        title: 代码执行
        type: code
        variables:
        - value_selector:
          - wakeup_llm
          - text
          value_type: string
          variable: llm_text
      height: 52
      id: wakeup_code
      position:
        x: 680
        y: 240
      positionAbsolute:
        x: 680
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        outputs:
        - value_selector:
          - wakeup_code
          - clean_json
          value_type: string
          variable: wakeup_json
        selected: false
        title: 输出
        type: end
      height: 88
      id: wakeup_end
      position:
        x: 980
        y: 240
      positionAbsolute:
        x: 980
        y: 240
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    viewport:
      x: -256
      y: -21
      zoom: 1
  rag_pipeline_variables: []
