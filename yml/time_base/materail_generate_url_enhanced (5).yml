    - data:
        code: "import math\n\ndef main(retrieved_docs: list, current_timestamp: int) -> dict:\n    HALF_LIFE_MS = 7 * 24 * 60 * 60 * 1000\n    decay_rate = math.log(2) / HALF_LIFE_MS\n    reranked_docs = []\n    if not retrieved_docs:\n        return {\"reranked_context\": \"\"}\n    ts = int(current_timestamp) if current_timestamp is not None else 0\n    for doc in retrieved_docs:\n        if not isinstance(doc, dict):\n            continue\n        content = doc.get(\"content\", \"\")\n        orig_score = float(doc.get(\"score\", 0.5))\n        metadata = doc.get(\"metadata\", {}) or {}\n        doc_time = int(metadata.get(\"updated_at\", ts - HALF_LIFE_MS))\n        time_diff = max(0, ts - doc_time)\n        decay_factor = math.exp(-decay_rate * time_diff)\n        final_score = orig_score * decay_factor\n        doc_age_days = round(time_diff / (24 * 60 * 60 * 1000))\n        time_tag = f\"[该兴趣记录于：{doc_age_days} 天前]\"\n        reranked_docs.append({\n            \"content\": f\"{time_tag} {content}\",\n            \"final_score\": final_score,\n            \"metadata\": metadata\n        })\n    reranked_docs.sort(key=lambda x: x[\"final_score\"], reverse=True)\n    merged_context = \"\\n\\n---\\n\\n\".join([d[\"content\"] for d in reranked_docs])\n    return {\"reranked_context\": merged_context}\n"
        code_language: python3
        desc: 对知识检索结果按 7 天半衰期做时间衰减重排
