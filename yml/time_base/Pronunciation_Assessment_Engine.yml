          \        else:\n            result[\"analysis\"] = \"评测完成\"\n          \
          \  result[\"suggestion\"] = \"请参考评分\"\n    except Exception as e:\n    \
          \    result[\"analysis\"] = \"评测完成\"\n    return result"
