            \ \"[该发音问题记录于：X 天前]\" 状态。\n1. 请优先评估和指正记录时间在 7 天以内的近期发音问题。\n2. 超过 30 天的历史发音问题，若在本次评测中未明显出现，请标记为\"\
            已纠正\"而非\"当前问题\"。\n3. 评估报告应明确指出：\"您当前最需纠正的发音是 [问题名称]（记录于 [X] 天前）\"。\n\n\
            【知识库检索 — 用户历史发音错误与矫正建议】\n检索到的用户历史发音错误与矫正建议（已按时间衰减重排）：\n{{#b2c3d4e5-f6a7-4012-pron-123456789012.reranked_context#}}\n\
            须优先参考上述检索内容中的近期发音问题；与当前 target_text 冲突时以 7 天内近期问题为主。\n\n# 评测维度\n1. 发音准确度\
            \ - 元音、辅音是否标准\n2. 重音位置 - 单词重音是否正确\n3. 连读弱读 - 是否影响理解\n\n# 输出格式\n严格输出 JSON\
            \ 格式，禁止包含 markdown 代码块（不要输出 ```json）：\n{\n  \"score\": 0-100的整数分数,\n \
            \ \"phonetic\": \"目标词的音标\",\n  \"issue_type\": \"vowel|consonant|stress|rhythm|other\"\
            ,\n  \"analysis\": \"简洁的问题分析（20-50字；若命中近期发音问题，须注明记录天数）\",\n  \"suggestion\"\
            : \"改进建议（20-50字）\"\n}"
        - id: c5fbe526-b667-4b1e-bafb-c259f8c580d5
