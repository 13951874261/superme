          \ if json_match:\n            parsed = json.loads(json_match.group())\n\
          \            result[\"score\"] = max(0, min(100, int(parsed.get(\"score\"\
          , 0))))\n            result[\"phonetic\"] = parsed.get(\"phonetic\", \"\"\
          )\n            result[\"issue_type\"] = parsed.get(\"issue_type\", \"other\"\
          )\n            result[\"analysis\"] = parsed.get(\"analysis\", \"\")\n \
