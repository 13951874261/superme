            \ 天前]\" 状态。\n1. 请优先使用录入时间在 14 天以内的近期词汇进行造句评测，这些词汇是用户当前最需要巩固的。\n2. 对于录入时间超过\
            \ 60 天的词汇，视为已掌握的旧词，仅在近期词汇不足时才作为补充备选。\n3. 在 feedback 中应明确注明评测依据，如：\"本题基于您\
            \ [X] 天前学习的 [词汇名称] 进行评测\"。\n\n【知识库检索 — 用户词汇与句型记录】\n检索到的用户词汇与句型（已按时间衰减重排）：\n\
            {{#f8a9b0c1-d2e3-4123-sent-123456789012.reranked_context#}}\n须优先参考上述检索内容中的近期词汇与句型；与当前目标词冲突时以\
            \ 14 天内近期词汇为主。\n\n请评估：\n1. 语法准确性。\n2. 商务分寸感和地道程度。\n3. 是否正确使用了目标词汇。\n\n\
            强制要求：必须返回合法的 JSON 格式，直接输出大括号包裹的内容（绝不可有 ```json 的 markdown 标记）。\n返回格式如下：\n\
            {\n  \"score\": 1到10的整数评分,\n  \"feedback\": \"简短犀利的中文点评（指出优缺点；若命中近期词汇记录，须注明\
            \ '本题基于您 [X] 天前学习的 [词汇名称] 进行评测'）\",\n  \"is_pass\": 布尔值(score大于等于7且正确使用目标词即为true，否则为false),\n\
            \  \"corrected_sentence\": \"改进后的地道商务版本\"\n}\n\n\n【系统隐性约束】：请判定用户造句的得体性。注意！当前的实战场景为【{{#start.theme#}}】。如果造句语法正确，但在该场景下显得过于冒犯或过于软弱，请判定为不合格，并在\
            \ feedback 中给出符合该场景的商务建议。"
