    - data:
        code: "def _kb_to_text(kb_result) -> str:\n    if not kb_result:\n        return\
          \ \"\"\n    if isinstance(kb_result, str):\n        return kb_result.strip()\n\
          \    lines = []\n    items = kb_result if isinstance(kb_result, list) else\
          \ []\n    for i, item in enumerate(items[:8]):\n        if isinstance(item,\
          \ dict):\n            content = item.get(\"content\") or item.get(\"text\"\
          ) or \"\"\n            title = item.get(\"title\") or item.get(\"document_name\"\
          ) or \"\"\n            line = str(content).strip() or str(title).strip()\n\
          \        else:\n            line = str(item).strip()\n        if line:\n\
          \            lines.append(f\"{i + 1}. {line[:500]}\")\n    return \"\\n\"\
          .join(lines)\n\ndef main(kb_business, kb_memory, http_memory_text: str)\
          \ -> dict:\n    biz_text = _kb_to_text(kb_business)\n    mem_text = _kb_to_text(kb_memory)\n\
          \    http_text = (http_memory_text or \"\").strip()\n    sections = []\n\
          \    if biz_text:\n        sections.append(\"【向量检索·业务知识库】\\n\" + biz_text)\n\
          \    if mem_text:\n        sections.append(\"【向量检索·用户记忆库】\\n\" + mem_text)\n\
          \    if http_text:\n        sections.append(http_text)\n    if not sections:\n\
          \        sections.append(\"（本轮未检索到历史记忆，仅依据侧写与会话作答。）\")\n    merged = \"\\\
          n\\n\".join(sections)\n    kb_used = \"1\" if (biz_text or mem_text) else\
          \ \"0\"\n    recall_used = \"1\" if http_text and \"【结构化即时召回】\" in http_text\
          \ else \"0\"\n    return {\n        \"merged_memory_context\": merged,\n\
          \        \"recall_used\": recall_used,\n        \"kb_used\": kb_used,\n \
          \   }\n"
        code_language: python3
        desc: 融合双 KB + HTTP记忆打包结果，供三模型 LLM 注入
