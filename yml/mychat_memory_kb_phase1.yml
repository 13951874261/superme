    - data:
        code: "import json\n\ndef _load_json(raw):\n    if raw is None:\n        return\
          \ None\n    if isinstance(raw, dict):\n        return raw\n    if isinstance(raw,\
          \ str):\n        s = raw.strip()\n        if not s:\n            return None\n\
          \        try:\n            return json.loads(s)\n        except Exception:\n\
          \            return None\n    return None\n\ndef _parse_recall(raw, status)\
          \ -> str:\n    data = _load_json(raw)\n    if not data:\n        try:\n \
          \           code = int(status or 0)\n        except Exception:\n       \
          \     code = 0\n        if code >= 400:\n            return f\"(recall HTTP\
          \ {code})\"\n        return \"\"\n    if data.get(\"success\") and data.get(\"\
          data\"):\n        return str(data[\"data\"].get(\"context\") or \"\").strip()\n\
          \    return \"\"\n\ndef _parse_context(raw, status) -> str:\n    data = _load_json(raw)\n\
          \    if not data:\n        try:\n            code = int(status or 0)\n \
          \       except Exception:\n            code = 0\n        if code >= 400:\n\
          \            return f\"(context HTTP {code})\"\n        return \"\"\n  \
          \  if not data.get(\"success\") or not data.get(\"data\"):\n        return\
          \ \"\"\n    d = data[\"data\"]\n    parts = []\n    if d.get(\"recentEpisodesSummary\"\
          ):\n        parts.append(\"【近期情景】\\n\" + str(d[\"recentEpisodesSummary\"\
          ]))\n    if d.get(\"errorLedgerSummary\"):\n        parts.append(\"【训练短板】\\\
          n\" + str(d[\"errorLedgerSummary\"]))\n    if d.get(\"graphSummary\"):\n\
          \        parts.append(\"【关系记忆】\\n\" + str(d[\"graphSummary\"]))\n    l3 =\
          \ d.get(\"memoryLayers\", {}).get(\"l3_vars\", {}) if isinstance(d.get(\"\
          memoryLayers\"), dict) else {}\n    if isinstance(l3, dict) and l3.get(\"\
          accent\"):\n        parts.append(\"【L3变量】\\naccent=\" + str(l3.get(\"accent\"\
          )))\n    return \"\\n\\n\".join(parts).strip()\n\ndef main(recall_body, context_body,\
          \ recall_status, context_status) -> dict:\n    recall_text = _parse_recall(recall_body,\
          \ recall_status)\n    ctx_text = _parse_context(context_body, context_status)\n\
          \    sections = []\n    if recall_text:\n        sections.append(\"【结构化即时召回】\\\
          n\" + recall_text)\n    if ctx_text:\n        sections.append(\"【画像与关系上下文】\\\
          n\" + ctx_text)\n    if not sections:\n        sections.append(f\"（HTTP链路\
          \ ctx={context_status} recall={recall_status}，未解析到记忆正文）\")\n    http_memory_text\
          \ = \"\\n\\n\".join(sections).strip()\n    return {\n        \"http_memory_text\"\
          : http_memory_text,\n        \"http_ok\": \"1\" if (recall_text or ctx_text)\
          \ else \"0\",\n    }\n"
        code_language: python3
        desc: context→recall 串行完成后打包 HTTP 记忆（避免 merge 并行竞态）
        outputs:
          http_memory_text:
            children: null
            type: string
          http_ok:
            children: null
            type: string
        selected: false
        title: HTTP记忆打包
        type: code
        variables:
        - value_selector:
