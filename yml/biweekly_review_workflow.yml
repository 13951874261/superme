# 对应 API Key: app-p8u1qA8A6iWDB6FzEOtjectn (VITE_DIFY_BIWEEKLY_REVIEW_API_KEY)
app:
  description: 两周一度的专属复盘与弱点扫描。解析实战比对、目标校准、短板扫描与战术调度，输出画像纠偏因子。
  icon: 🎯
  icon_background: '#09090B'
  icon_type: emoji
  mode: workflow
  name: Biweekly Review Workflow
  use_icon_as_answer_icon: false
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      image:
        enabled: false
      enabled: false
      number_limits: 3
    opening_statement: ''
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
  graph:
    edges:
    - data:
        sourceType: start
        targetType: llm
      id: start-to-llm
      source: start
      sourceHandle: source
      target: llm-node
      targetHandle: target
      type: custom
    - data:
        sourceType: llm
        targetType: end
      id: llm-to-output
      source: llm-node
      sourceHandle: source
      target: output
      targetHandle: target
      type: custom
    nodes:
    - data:
        selected: false
        title: 开始
        type: start
        variables:
        - label: 实战检验比对
          max_length: 800
          options: []
          required: true
          type: text-input
          variable: practical_test
        - label: 目标动态校准
          max_length: 800
          options: []
          required: true
          type: text-input
          variable: goal_alignment
        - label: 短板瓶颈扫描
          max_length: 800
          options: []
          required: true
          type: text-input
          variable: weakness_scan
        - label: 战术火力调度
          max_length: 800
          options: []
          required: true
          type: text-input
          variable: tactical_dispatch
        - label: 用户当前画像
          max_length: 500
          options: []
          required: false
          type: text-input
          variable: user_current_profile
      height: 115
      id: start
      position:
        x: 80
        y: 200
      positionAbsolute:
        x: 80
        y: 200
      selected: false
      type: custom
      width: 242
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 两周期复盘与战术纠偏分析
        model:
          completion_params:
            temperature: 0.7
          mode: chat
          name: gpt-4o
          provider: openai
        prompt_template:
        - edition_type: basic
          id: biweekly-sys-prompt
          role: system
          text: |-
            你是专为高层管理者设计的训练系统纠偏教练。
            用户每两周提交一次结构化复盘，你需要：
            1. 综合四个维度，指出当前训练方向与真实瓶颈的偏差。
            2. 给出下两周应集中火力击穿的核心短板。
            3. 提取 1-3 个最精准的能力短板词，用于更新全局用户画像。

            【输出规范】
            请必须且只能按照以下 XML 格式返回，不要包含任何多余文字：
            <response>
              <analysis>150字左右的复盘研判与纠偏建议</analysis>
              <factors>1至3个短板词，英文逗号分隔，如：即兴逻辑散乱,上级质询承压弱</factors>
            </response>
        - id: biweekly-user-prompt
          role: user
          text: |-
            用户当前画像：{{#start.user_current_profile#}}

            【1. 实战检验比对】
            {{#start.practical_test#}}

            【2. 目标动态校准】
            {{#start.goal_alignment#}}

            【3. 短板瓶颈扫描】
            {{#start.weakness_scan#}}

            【4. 战术火力调度】
            {{#start.tactical_dispatch#}}
        selected: false
        title: 复盘纠偏LLM
        type: llm
        vision:
          enabled: false
      height: 88
      id: llm-node
      position:
        x: 380
        y: 200
      positionAbsolute:
        x: 380
        y: 200
      selected: false
      type: custom
      width: 242
    - data:
        outputs:
        - value_selector:
          - llm-node
          - text
          variable: result
        selected: false
        title: 结束
        type: end
      height: 88
      id: output
      position:
        x: 680
        y: 200
      positionAbsolute:
        x: 680
        y: 200
      selected: false
      type: custom
      width: 242
  rag_pipeline_variables: []
